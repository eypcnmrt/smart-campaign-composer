# Everything `make test` needs, with nothing installed on the host but Docker: a throwaway PostgreSQL
# and containers that run the Go checks and the hook/script tests. No API key is involved.
#
#   docker compose -f docker-compose.test.yml run --rm backend
#   docker compose -f docker-compose.test.yml run --rm hooks
#   docker compose -f docker-compose.test.yml run --rm web

name: scc-test

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_PASSWORD: test
    # Test data only: durability is not needed, speed is.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "max_connections=200"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  # gofmt, go vet, and go test -race for every package, including the integration tests that need the database.
  backend:
    image: golang:1.27
    working_dir: /src
    command: ["sh", "scripts/test-backend.sh"]
    environment:
      GOFLAGS: -buildvcs=false
      TEST_DATABASE_URL: postgres://postgres:test@db:5432/postgres?sslmode=disable
    volumes:
      - .:/src:ro
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

  # Tests of the protection hooks and of the session scanner.
  hooks:
    image: node:22-alpine
    working_dir: /src
    command: ["node", "--test", ".claude/hooks/*.test.cjs", "scripts/*.test.cjs"]
    volumes:
      - .:/src:ro

  # The web app: npm ci from the lock file, npm audit, vue-tsc and vitest, in the same pinned node image as scripts/web.sh.
  # The checkout is read-only; scripts/test-web.sh works on a copy. The npm cache is the volume that scripts/web.sh uses too
  # (external, so `down --volumes` leaves it alone and the packages are not downloaded again on every run).
  web:
    image: node:24.14.0-alpine
    command: ["sh", "/src/scripts/test-web.sh"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - .:/src:ro
      - npm-cache:/root/.npm

volumes:
  gomod:
  gocache:
  npm-cache:
    external: true
    name: scc-npm-cache
