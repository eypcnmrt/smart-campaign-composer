# CI. Reasons and limits are in DECISIONS.md ("Continuous integration").
#
#  * No secret is read and no real model is called: LLM_MODE is mock for the whole workflow, there is no ANTHROPIC_API_KEY
#    and there is no dotenv file in a checkout.
#  * The workflow can only read the repository (permissions below), and the checkout does not keep its token in .git.
#  * The only action is the official actions/checkout, pinned to a full commit SHA (the tag is in the comment).
#  * Everything that runs code runs in the same Docker images as on a developer machine (make test, make e2e).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run of the same branch (or pull request) cancels the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_MODE: mock

jobs:
  test:
    name: make test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: make test
        run: make test

  compose-up:
    name: compose up without a dotenv file
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: No dotenv file in the checkout
        run: |
          for f in .env .env.*; do
            if [ -e "$f" ] && [ "$f" != ".env.example" ]; then
              echo "unexpected dotenv file in the checkout: $f" >&2
              exit 1
            fi
          done
      - name: Build and start the stack (waits until web and worker are healthy)
        run: docker compose up -d --build --wait web worker
      - name: The api runs with the mock model
        run: |
          curl -fsS http://127.0.0.1:3000/api/config | tee config.json
          echo
          jq -e '.llm_mode == "mock"' config.json
      - name: The web app answers
        run: curl -fsS -o /dev/null http://127.0.0.1:3000/
      - name: Compose logs (only when a step failed)
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop the stack and remove its volume
        if: always()
        run: docker compose down --volumes --remove-orphans
