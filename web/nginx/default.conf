# The web container: the built app, and the API behind the same address (so the browser makes only same-origin requests and the
# content security policy can say 'self' everywhere).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The API takes small JSON bodies (the longest is the email body, a few kilobytes).
    client_max_body_size 256k;

    # Docker's own resolver, asked again every few seconds: the api container may be recreated with another address, and a
    # name written into proxy_pass directly would be resolved once, at start.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # For compose and for whoever wants to know that nginx itself is up (not the API: that is /api/readyz).
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # The API. The content stream is Server-Sent Events: nothing may hold the events back, so no buffering and no cache, and the
    # read timeout is longer than the longest generation (the API gives up on the model long before that). The path is passed on
    # as it came (a variable in proxy_pass without a URI keeps it).
    location ^~ /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 10m;
        gzip off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Built files have a hash in their name: they never change, so they are cached for good.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The app. Any other path is a route of the single page, so it gets index.html (which must not be cached: it names the
    # current hashed files). A missing file with an extension is a real 404, not the app.
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
