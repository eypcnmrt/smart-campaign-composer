# Security headers of every response the web container makes. nginx drops the add_header lines of the outer level as soon as a
# location has one of its own, so each location that sets a header (cache control, say) includes this file again; a location
# that forgot to would answer without them.
#
# The policy allows only what the built app needs: its own scripts, its own style sheet (Vite writes the CSS to a file), its own
# fonts (they are files in the build, never data: URLs), images from itself or data: URLs, and requests to its own origin
# (the API is behind the same host). No inline script, no inline style, no eval.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
