# The stack: database, migrations, seed data, mock provider, worker, the api (port 8080 on this machine) and the web app
# (http://127.0.0.1:3000, which also forwards /api to the api).
#
# Every setting has a default, so `docker compose up` works without a .env file. The values below
# are for local development only (the database is not published outside the compose network).

name: smart-campaign-composer

x-composer: &composer
  build:
    context: ./backend
    target: composer
  image: smart-campaign-composer/composer:dev
  environment: &composer-env
    DATABASE_URL: postgres://${POSTGRES_USER:-scc}:${POSTGRES_PASSWORD:-scc-dev-password}@db:5432/${POSTGRES_DB:-scc}?sslmode=disable
    PROVIDER_URL: http://mock-provider:8081

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scc-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-scc}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-off jobs: they run to completion and the services behind them wait for that.
  migrate:
    <<: *composer
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *composer
    command: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # The provider misbehaves a little by default (5 % 500, 5 % 429 with Retry-After, 20 to 200 ms of latency) so that a send in the demo
  # shows retries on the dashboard. The tests, the soak and the browser tests set their own, deterministic values (see
  # docker-compose.soak.yml and docker-compose.e2e.yml); set the three rates to 0 here for a provider that never fails.
  mock-provider:
    build:
      context: ./backend
      target: mock-provider
    image: smart-campaign-composer/mock-provider:dev
    environment:
      MOCK_SEED: ${MOCK_SEED:-1}
      MOCK_DELAY_MIN: ${MOCK_DELAY_MIN:-20ms}
      MOCK_DELAY_MAX: ${MOCK_DELAY_MAX:-200ms}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE:-0.05}
      MOCK_THROTTLE_RATE: ${MOCK_THROTTLE_RATE:-0.05}
      MOCK_RETRY_AFTER: ${MOCK_RETRY_AFTER:-1s}
      MOCK_RATE_LIMIT: ${MOCK_RATE_LIMIT:-0}
      MOCK_LATE_RATE: ${MOCK_LATE_RATE:-0}
      MOCK_LATE_DELAY: ${MOCK_LATE_DELAY:-3s}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *composer
    command: ["api"]
    environment:
      <<: *composer-env
      # auto: the real model when a key is set, the demo mock otherwise (no dotenv file is needed to start).
      LLM_MODE: ${LLM_MODE:-auto}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_FALLBACK: ${ANTHROPIC_FALLBACK:-}
      WORKER_STALE_AFTER: ${WORKER_STALE_AFTER:-10s}
    # No authentication (docs/PLAN.md, assumption 13) and it can spend credit: reachable from this machine only.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    # Open content streams end with an event, requests in flight finish (15s inside the api).
    stop_grace_period: 20s
    restart: unless-stopped

  worker:
    <<: *composer
    command: ["worker"]
    environment:
      <<: *composer-env
      WORKER_RATE: ${WORKER_RATE:-100}
      WORKER_REQUEST_TIMEOUT: ${WORKER_REQUEST_TIMEOUT:-5s}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-2s}
      # The worker's own /metrics and /healthz; inside the compose network only (nothing is published on the host).
      WORKER_METRICS_ADDR: ":9091"
    depends_on:
      seed:
        condition: service_completed_successfully
      mock-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    # Time to finish the sends in flight after SIGTERM (the request timeout is 5s).
    stop_grace_period: 20s
    restart: unless-stopped

  # The app and the only address a browser needs: static files, and /api forwarded to the api with the event stream unbuffered.
  # nginx runs as an unprivileged user on 8080 with a read-only file system (it writes only to /tmp). Like the api it has no
  # authentication to hide behind, so it is reachable from this machine only.
  web:
    build:
      context: ./web
    image: smart-campaign-composer/web:dev
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
